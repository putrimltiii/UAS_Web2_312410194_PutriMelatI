<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100">

    <div id="app">
        <router-view></router-view>
    </div>

    <script type="module">
        import Home      from './components/Home.js'
        import Login     from './components/Login.js'
        import Dashboard from './components/Dashboard.js'
        import Barang    from './components/Barang.js'
        import Kategori  from './components/Kategori.js'

        const routes = [
            { path: '/',          component: Home },
            { path: '/login',     component: Login },
            { path: '/dashboard', component: Dashboard, meta: { requiresAuth: true } },
            { path: '/barang',    component: Barang,    meta: { requiresAuth: true } },
            { path: '/kategori',  component: Kategori,  meta: { requiresAuth: true } },
        ]

        const router = VueRouter.createRouter({
            history: VueRouter.createWebHashHistory(),
            routes
        })

        // Navigation Guard
        router.beforeEach((to, from, next) => {
            const isLoggedIn = localStorage.getItem('isLoggedIn')
            if (to.meta.requiresAuth && !isLoggedIn) {
                next('/login')
            } else {
                next()
            }
        })

        // Axios Interceptor - otomatis sisipkan token
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('token')
            if (token) {
                config.headers.Authorization = `Bearer ${token}`
            }
            return config
        })

        // Axios Interceptor - tangkap error 401
        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response && error.response.status === 401) {
                    alert('Sesi habis! Silakan login kembali.')
                    localStorage.clear()
                    router.push('/login')
                }
                return Promise.reject(error)
            }
        )

        const app = Vue.createApp({})
        app.use(router)
        app.mount('#app')
    </script>

</body>
</html>
